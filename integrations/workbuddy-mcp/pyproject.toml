[project]
name = "workbuddy-mcp"
version = "0.1.0"
description = "WorkBuddy MCP server for the KAP knowledge platform"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0,<2", "httpx>=0.27"]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[project.scripts]
workbuddy-mcp = "workbuddy_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workbuddy_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = [".", "src"]
