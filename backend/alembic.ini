# Alembic configuration - IMPLEMENT-00 baseline.
# The database URL is read from the DATABASE_URL environment variable in
# alembic/env.py (this file does not hardcode credentials).
# Keep this file ASCII-only: Alembic reads it with the OS locale encoding,
# which can be non-UTF-8 (e.g. GBK on some Windows hosts).

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# sqlalchemy.url is intentionally left blank; env.py loads DATABASE_URL.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
