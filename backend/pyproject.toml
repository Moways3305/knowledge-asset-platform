[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knowledge-asset-platform-backend"
version = "0.1.0"
description = "AI Knowledge Asset Platform backend (FastAPI)."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "httpx>=0.28",
    "celery>=5.4",
    "redis>=5.2",
    # multipart/form-data 文件上传（本地上传通道）。
    "python-multipart>=0.0.12",
    # 文本抽取（入库抽取管线，纯 Python，无系统二进制依赖）。
    "pypdf>=5.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "aiosqlite>=0.20",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

# 覆盖率基线（首阶段只观测、不设硬性阈值 fail_under）。
[tool.coverage.run]
source = ["app"]
branch = true
# 仅 dev/test 用的种子脚本不计入业务覆盖率，避免稀释。
omit = ["app/seed/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

# 类型检查基线（首阶段宽松模式：只抓明显的类型错误，不强制全量注解）。
# 后续按模块用 per-module overrides 逐步收紧到 --strict 子集。
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
# 首阶段：第三方库缺 stub 不报错（celery / asyncpg 等无完整类型）。
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

# 代码格式化基线（ruff format）。零配置默认即可：quote-style=double、行宽取上方 line-length=100。
# 显式登记以表明已纳入格式化门禁；CI 用 `ruff format --check app tests` 阻断未格式化代码。
[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # E501：存量超长行绝大多数是中文注释/用户态文案，逐行折行是纯排版大 diff，
    # 与"不为过 lint 改动业务代码"的边界冲突；显式豁免，新代码仍建议守 100 列。
    "E501",
    # B904：raise ... from err 改异常链需逐处评审语义（区分 from err / from None），
    # 属于行为相邻改动，不在 lint 接入任务内批量处理；留待单独任务逐个评审。
    "B904",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 在参数默认值里调用 Depends/Query/File/Form 是框架惯用法，非 B008 想抓的
# "可变默认值"问题；按 ruff 官方建议登记为 immutable calls，保留 B008 抓真实缺陷。
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form"]
