name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Reject committed local acceptance evidence
        working-directory: ${{ github.workspace }}
        run: python scripts/check_no_acceptance_evidence.py --tracked
      - name: Install (locked deps; dev lock is constrained to the image lock)
        # requirements-dev.lock 由 requirements.lock 约束生成（见文件头命令），
        # 运行时依赖版本与生产镜像逐一相同；应用本体按 Dockerfile 同方式安装。
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation .
      - name: Lint (ruff)
        run: python -m ruff check app tests
      - name: Format check (ruff format)
        # 阻断未格式化代码（配置见 pyproject [tool.ruff.format]）。本地用 `ruff format app tests` 修复。
        run: python -m ruff format --check app tests
      - name: Type check (mypy)
        # 类型检查基线（宽松模式，配置见 pyproject [tool.mypy]）。首阶段目标零 error；
        # 后续按模块逐步收紧到 --strict 子集。
        run: python -m mypy app --config-file pyproject.toml
      - name: Compile check
        run: python -m compileall app
      - name: Architecture boundaries
        working-directory: ${{ github.workspace }}
        run: python scripts/check_architecture.py
      - name: Tests (with coverage)
        # 覆盖率基线：term-missing 把未覆盖行号打进 CI log。首阶段不设 fail_under 阈值，
        # 只观测；source/omit 见 pyproject [tool.coverage.run]。
        run: python -m pytest --cov=app --cov-report=term-missing
      - name: Export OpenAPI contract & check drift
        # 重新导出 spec（含 no-leak 扫描）；若与已提交的 docs/api/openapi.json 不一致，
        # 说明后端 schema 改了但契约没更新 → diff 非空 → CI 失败。
        # 脚本基于自身路径定位仓库根，故在 backend 工作目录下用相对路径调用上一级。
        working-directory: ${{ github.workspace }}
        run: |
          python scripts/export_openapi.py
          git diff --exit-code docs/api/openapi.json

  backend-migrations:
    name: Backend (alembic migrations on PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          # CI 一次性临时凭证，仅存在于本 job 的临时容器内，与任何真实环境无关。
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_throwaway_only
          POSTGRES_DB: ci_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://ci:ci_throwaway_only@localhost:5432/ci_migrations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install (production lock, identical to backend image)
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps --no-build-isolation .
      - name: Alembic upgrade head
        run: python -m alembic upgrade head
      - name: Alembic downgrade -1 (latest migration must be reversible)
        run: python -m alembic downgrade -1
      - name: Alembic re-upgrade head (replay after rollback)
        run: python -m alembic upgrade head

  backend-image:
    name: Backend (docker build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t kap-backend-ci ./backend

  integrations:
    name: Integrations (workbuddy-mcp lint + test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: integrations/workbuddy-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff & deps
        run: |
          python -m pip install ruff pytest
          python -m pip install -e .
      - name: Lint (ruff)
        run: python -m ruff check src tests
      - name: Format check (ruff format)
        run: python -m ruff format --check src tests
      - name: Tests
        run: python -m pytest tests -q

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check (prettier)
        # 阻断未格式化前端代码（配置见 .prettierrc）。本地用 `npm run format` 修复。
        run: npx prettier --check src
      - name: Test (with coverage)
        # npm run test = vitest run；这里用 --coverage 一次跑测试 + 覆盖率（首阶段无阈值，只观测）。
        run: npx vitest run --coverage
      - name: Build
        run: npm run build

  frontend-image:
    name: Frontend (docker build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t kap-frontend-ci .

  frontend-ui-qa:
    name: Frontend (UI layout smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      UI_QA_BASE: http://localhost:4173
      UI_QA_OUT_DIR: ${{ github.workspace }}/ui_qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Playwright chromium
        run: npx playwright install chromium
      - name: Build
        run: npm run build
      - name: Start preview server
        # CI 无后端，页面呈现空态/错误态；脚本只验证布局（横向溢出），
        run: |
          nohup npm run preview -- --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS "$UI_QA_BASE" > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "preview server did not start" >&2
          cat preview.log >&2
          exit 1
      - name: UI QA (model connection autofill state)
        run: npm run test:ui:model-autofill
      - name: UI QA (project settings reference layout)
        run: npm run test:ui:project-settings
      - name: UI QA (knowledge asset library reference layout)
        run: npm run test:ui:knowledge-list
      - name: UI QA (knowledge asset detail reference layout)
        run: npm run test:ui:knowledge-detail
      - name: UI QA (admin operations diagnostics and targeted retry)
        run: npm run test:ui:admin-operations
      - name: UI QA (model and knowledge foundation security)
        run: npm run test:ui:model-foundation
      - name: UI QA (WeCom scan operations and browser safety)
        run: npm run test:ui:wecom-scan
      - name: UI QA (audit and security operations workspace)
        run: npm run test:ui:audit-security
      - name: UI QA (people and permissions governance)
        run: npm run test:ui:people-permissions
      - name: UI QA (help and global experience)
        run: npm run test:ui:help-global
      - name: UI QA (global frontend acceptance)
        run: npm run test:ui:global-acceptance
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-qa-screenshots
          path: ${{ github.workspace }}/ui_qa
          retention-days: 7
