# 前端生产 nginx：静态托管 Vite dist + 同源反代后端。
# 同源部署下前端用相对路径调用 /api/v1、/health*、/admin/ops；httpOnly 会话 cookie
# 在同源下天然可用，无需改写 cookie 域。不含任何 secret / 后端内网真实地址（仅 Docker DNS）。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 允许 Path B 上传（后端上限 25 MiB），放宽代理体积上限。
    client_max_body_size 30m;

    # Docker Compose 内置 DNS。使用变量 proxy_pass 让 nginx 在请求期解析 backend，
    # 避免容器启动瞬间服务名未就绪导致 nginx 直接退出。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $kap_backend http://backend:8000;

    # 反代统一转发头（server 级，被下方 proxy location 继承）。
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # 业务 API（保留完整原始路径 /api/v1/... 转发到后端）。
    location /api/v1/ {
        proxy_pass $kap_backend;
    }

    # 健康探针（liveness / readiness / 安全配置诊断）。前缀匹配覆盖 /health、/health/ready、/health/config。
    location /health {
        proxy_pass $kap_backend;
    }

    # 运营端点（ops summary 当前挂在 root 路径，不在 /api/v1 下）。
    location /admin/ops/ {
        proxy_pass $kap_backend;
    }

    # 带 hash 的静态资源长缓存、不可变。
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # index.html 不缓存，保证发新版即时生效。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA 路由 fallback：非 API/静态路径回退到 index.html，由前端路由接管。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
