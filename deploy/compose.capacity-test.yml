# Disposable, synthetic-only capacity rehearsal. No host ports or external network.
# KAP_CAPACITY_IMAGE must contain backend/requirements.lock dependencies.
# docker compose -p kap-capacity-local -f deploy/compose.capacity-test.yml up -d
# docker compose ... run --rm probe python /probe/capacity_probe.py --help
name: kap-capacity-local
x-app: &app
  image: ${KAP_CAPACITY_IMAGE:?Build the backend image first}
  entrypoint: []
  user: "10000:10000"
  environment: &env
    KAP_CAPACITY_ISOLATED: "1"
    APP_ENV: prod
    LOG_LEVEL: WARNING
    DATABASE_URL: postgresql+asyncpg://capacity:capacity@postgres:5432/kap_capacity_test
    REDIS_URL: redis://redis:6379/0
    CELERY_TASK_ALWAYS_EAGER: "false"
    AUTH_ATTEMPT_HASH_SECRET: synthetic-capacity-auth-secret
    CSRF_TOKEN_SECRET: synthetic-capacity-csrf-secret
    KAP_PUBLIC_BASE_URL: https://api:8443
    PYTHONPATH: /app:/probe
    STORAGE_ROOT: /data/uploads
    LLM_PROVIDER: custom
    LLM_BASE_URL: http://fixture:9000/v1
    LLM_API_KEY: synthetic-only
    LLM_MODEL: synthetic
    LLM_TIMEOUT: "5"
    WEKNORA_BASE_URL: http://fixture:9000
    WEKNORA_API_KEY: sk-synthetic-only
    INGEST_LEASE_TIMEOUT_SECONDS: "30"
    INGEST_RECOVERY_SCAN_SECONDS: "15"
    INGEST_RECOVERY_BASE_DELAY_SECONDS: "1"
  volumes:
    - ../backend/app:/app/app:ro
    - ../backend/alembic:/app/alembic:ro
    - ../backend/alembic.ini:/app/alembic.ini:ro
    - ../backend/requirements.lock:/locked-requirements.txt:ro
    - ../backend/tools:/probe:ro
    - type: volume
      source: uploads
      target: /data/uploads
      volume: {nocopy: true}
    - type: volume
      source: state
      target: /capacity
      volume: {nocopy: true}
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: capacity, POSTGRES_PASSWORD: capacity, POSTGRES_DB: kap_capacity_test}
    tmpfs: [/var/lib/postgresql/data]
    cpus: 1.5
    mem_limit: 1g
    healthcheck:
      test: [CMD-SHELL, pg_isready -U capacity -d kap_capacity_test]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    command: [redis-server, --save, "", --appendonly, "no"]
    cpus: 0.5
    mem_limit: 128m
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 30
  fixture:
    <<: *app
    command: [python, /probe/capacity_fixture.py]
    cpus: 1
    mem_limit: 256m
  init:
    <<: *app
    user: "0:0"
    command: [python, /probe/capacity_probe.py, seed]
    cpus: 1
    mem_limit: 512m
  api:
    <<: *app
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, "8443", --workers, "2", --ssl-keyfile, /capacity/key.pem, --ssl-certfile, /capacity/cert.pem, --no-access-log]
    depends_on:
      init: {condition: service_completed_successfully}
    cpus: 2
    mem_limit: 1g
  worker:
    <<: *app
    command: [celery, -A, app.worker.celery_app, worker, -Q, ocr, --concurrency=4, --prefetch-multiplier=1, --loglevel=WARNING]
    depends_on:
      init: {condition: service_completed_successfully}
    cpus: 2
    mem_limit: 1536m
  light:
    <<: *app
    command: [celery, -A, app.worker.celery_app, worker, -Q, default, --concurrency=2, --prefetch-multiplier=1, --loglevel=WARNING]
    depends_on:
      init: {condition: service_completed_successfully}
    cpus: 1
    mem_limit: 768m
  beat:
    <<: *app
    command: [celery, -A, app.worker.celery_app, beat, --schedule=/capacity/beat, --loglevel=WARNING]
    depends_on:
      init: {condition: service_completed_successfully}
    cpus: 0.25
    mem_limit: 256m
  probe:
    <<: *app
    profiles: [probe]
    command: [python, /probe/capacity_probe.py, smoke]
    cpus: 2
    mem_limit: 768m

networks:
  default: {internal: true}
volumes:
  uploads:
  state:
