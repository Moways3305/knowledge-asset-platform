# KAP_UPLOAD_RULES_BEGIN
# Included inside the existing KAP server block. TLS, Certbot, ONLYOFFICE,
# validation files, and the catch-all location remain owned by the host site.
location = /api/v1/ingest/upload {
    client_max_body_size 32m;
    client_body_timeout 120s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    proxy_pass http://127.0.0.1:18080;
}

location ^~ /api/v1/ingest/upload-sessions {
    client_max_body_size 32m;
    client_body_timeout 120s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    proxy_pass http://127.0.0.1:18080;
}
# KAP_UPLOAD_RULES_END
