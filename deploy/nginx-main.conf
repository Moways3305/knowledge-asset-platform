# 前端容器主 nginx 配置（替换镜像内置 /etc/nginx/nginx.conf）。
# 以非 root 的 nginx 用户运行：故省略 `user` 指令（非特权 master 会忽略它并告警），
# 并把 pid / 临时目录改到 nginx 可写路径。http 级指令（gzip、限速 zone、临时目录、
# 日志）集中在此；server 块由 /etc/nginx/conf.d/default.conf（envsubst 渲染的模板）提供。

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    # 临时目录改到 nginx 用户可写路径（Dockerfile 已 chown /var/cache/nginx、pid 落 /tmp），
    # 否则非 root master 无法在默认 /var/run、/var/cache 下写入而启动失败。
    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path       /var/cache/nginx/proxy_temp;
    fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
    scgi_temp_path        /var/cache/nginx/scgi_temp;

    # 日志直送 stdout/stderr，交由容器日志采集；不落本地文件（避免 root 路径写入问题）。
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # 文本类响应压缩（静态 JS/CSS/JSON/SVG）。
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        image/svg+xml;

    # 限速 zone（按 location 在 server 块内启用）。
    # 登录端点更严（防爆破），整体 /api/v1 给较宽阈值（不影响正常使用）。
    # 超限返回 429 Too Many Requests（语义正确），而非默认 503（会被误判为服务不可用）。
    limit_req_status 429;
    limit_req_zone $binary_remote_addr zone=api_login:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=api_all:10m rate=30r/s;
    # Remote MCP has its own, deliberately tighter edge budget. The application also
    # enforces per-credential limits so NAT users do not share the whole safety boundary.
    limit_req_zone $binary_remote_addr zone=workbuddy_mcp:10m rate=1r/s;

    # The public host proxy is the only process able to reach the loopback-bound
    # frontend port. Preserve its validated HTTPS marker across the inner hop.
    map $http_x_forwarded_proto $kap_forwarded_proto {
        default $scheme;
        https https;
    }

    # 渲染后的 server 块。
    include /etc/nginx/conf.d/*.conf;
}
