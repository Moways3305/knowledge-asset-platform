# 本地开发 / 单机部署编排。
# 凭证为 LOCAL DEV ONLY，**绝非生产凭证**；生产请用部署密钥注入（见 backend/README §部署）。
#
# 一键启动顺序（PowerShell）：
#   cp .env.example .env            # 本地 APP_ENV=dev；设置 POSTGRES_PASSWORD 和 REDIS_PASSWORD
#   cp backend/.env.example backend/.env # 已有配置不要覆盖；集成配置由此注入
#   docker compose build
#   docker compose up -d            # postgres/redis 起后，migrate 一次性跑迁移，backend/worker/ocr_worker/parse_worker/notification_worker/beat 随后启动
#   # 迁移已由 migrate 服务自动执行（backend/worker/ocr_worker/parse_worker/notification_worker/beat 依赖其成功完成），无需手动 alembic
#   # 可选 seed（仅 dev/test）：docker compose exec backend python -m app.seed.dev_seed
#   # 冒烟：GET http://localhost:8001/health 与 /health/ready
#
# 本机 8000 常被占用，backend 宿主端口映射为 127.0.0.1:8001（容器内仍 8000，仅绑回环供调试）；
# 前端 vite 代理已对齐 8001。生产用户入口＝ frontend（宿主 18080）。
#
# 资源限制（deploy.resources.limits）为起始建议值，同机还跑 WeKnora + ONLYOFFICE，
# 不宜过保守；首次上线后按 `docker stats` 实测调整（直接改本文件，或用 prod overlay
# `docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d` 覆盖）。

# 共享运行时环境（避免各服务重复 env 块）。worker/ocr_worker/parse_worker/notification_worker/beat 与 backend 用同一份环境，
# 确保 WeKnora / LLM / WeCom / ONLYOFFICE 等外部集成开关一致。
x-backend-build: &backend-build
  context: ./backend
  args:
    KAP_DEBIAN_MIRROR: ${KAP_DEBIAN_MIRROR:-}
    KAP_DEBIAN_SECURITY_MIRROR: ${KAP_DEBIAN_SECURITY_MIRROR:-}

x-backend-env: &backend-env
  APP_NAME: knowledge-asset-platform
  APP_ENV: ${APP_ENV:-prod}
  APP_VERSION: ${APP_VERSION:-0.1.0}
  LOG_LEVEL: INFO
  # DATABASE_URL 的密码部分不在此拼接——避免密码含 URL 特殊字符（% @ / # 等）
  # 时被 URL 解析器误处理。POSTGRES_PASSWORD 作为独立变量，postgres 服务用它
  # 初始化数据库，后端用它经 sqlalchemy URL.create 正确编码后构建连接串。
  # 下列占位密码会被 POSTGRES_PASSWORD 覆盖（见 config.py _inject_postgres_password）。
  DATABASE_URL: postgresql+asyncpg://dev:__PG_PASSWORD__@postgres:5432/knowledge_platform
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (set it in ./.env)}
  # Redis 密码经 compose 变量插值（从 ./.env 读 REDIS_PASSWORD），不在此硬编码密码值。
  # backend/worker/beat/migrate 共用本变量连接同一带密码的 Redis。
  # :? 缺失即 fail-fast（compose 直接报错退出），不静默降级为空密码。
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required (set it in ./.env)}@redis:6379/0
  # 启用真正异步（入队到 broker，由 worker 执行）。设为 true 则内联同步执行（无需 worker）。
  CELERY_TASK_ALWAYS_EAGER: "false"
  CELERY_DEFAULT_QUEUE: default
  CELERY_OCR_QUEUE: ocr
  CELERY_PARSE_QUEUE: parse
  CELERY_NOTIFICATION_QUEUE: notifications
  INGEST_LEASE_TIMEOUT_SECONDS: ${INGEST_LEASE_TIMEOUT_SECONDS:-900}
  INGEST_PROCESSING_WINDOW: ${INGEST_PROCESSING_WINDOW:-5}
  INGEST_HEAVY_PROCESSING_WINDOW: ${INGEST_HEAVY_PROCESSING_WINDOW:-1}
  INGEST_RECOVERY_MAX_ATTEMPTS: ${INGEST_RECOVERY_MAX_ATTEMPTS:-3}
  OCR_RENDER_TIMEOUT_SECONDS: ${OCR_RENDER_TIMEOUT_SECONDS:-45}
  OCR_PAGE_TIMEOUT_SECONDS: ${OCR_PAGE_TIMEOUT_SECONDS:-60}
  OCR_DOCUMENT_TIMEOUT_SECONDS: ${OCR_DOCUMENT_TIMEOUT_SECONDS:-600}
  OCR_MAX_PAGES: ${OCR_MAX_PAGES:-100}
  OCR_MAX_RENDERED_PIXELS: ${OCR_MAX_RENDERED_PIXELS:-20000000}
  OCR_MAX_TOTAL_PIXELS: ${OCR_MAX_TOTAL_PIXELS:-100000000}
  # 受控上传存储根（绝对路径）。backend 写入、worker 异步读取**同一份**字节——靠
  # 下方共享命名 volume `upload_storage` 挂到此路径。当前为 LocalFileStorage 与共享
  # 持久卷；S3/OSS/MinIO 适配尚未实现。ref/路径保持 server-only。
  STORAGE_ROOT: /data/uploads
  # 真实外部集成在此按需注入（默认空=降级/桩）；切勿把真实密钥提交进仓库：
  # WEKNORA_BASE_URL / WEKNORA_API_KEY / LLM_PROVIDER / LLM_API_KEY /
  # WECOM_CORP_ID / WECOM_APP_SECRET / WECOM_NOTIFY_ENABLED /
  # ONLYOFFICE_ENABLED / ONLYOFFICE_DOCUMENT_SERVER_URL / ONLYOFFICE_JWT_SECRET
  # 浏览器 CSP origin 同时注入 backend，仅用于 /health/config 安全一致性诊断。
  ONLYOFFICE_ORIGIN: ${ONLYOFFICE_ORIGIN:-}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: dev
      # 密码经 compose 变量插值（从 ./.env 读 POSTGRES_PASSWORD），不硬编码；
      # :? 缺失即 fail-fast（与 REDIS_PASSWORD 一致），避免弱密码误上线。
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (set it in ./.env)}
      POSTGRES_DB: knowledge_platform
    # 仅绑回环：供本机调试连库；不暴露到局域网/公网（生产单机部署可整段删除映射）。
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d knowledge_platform"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G

  redis:
    image: redis:7
    restart: unless-stopped
    # 启用密码（--requirepass）。REDIS_PASSWORD 经 compose 从 ./.env 插值，不硬编码；
    # :? 缺失即 fail-fast，避免无密码 Redis 误上线。
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required (set it in ./.env)}"]
    # 仅绑回环，理由同 postgres。
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - internal
    healthcheck:
      # 带密码探活；变量在 compose 解析期插值为具体值（:? 缺失即 fail-fast）。
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD:?REDIS_PASSWORD is required (set it in ./.env)}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # 一次性迁移服务。只此一处跑 alembic upgrade head，backend/worker/ocr_worker/parse_worker/notification_worker/beat 依赖其成功完成，
  # 避免每个副本并发迁移；它退出即完成（restart=no）。
  migrate:
    build: *backend-build
    command: python -m alembic upgrade head
    env_file:
      - ./backend/.env
    environment: *backend-env
    restart: "no"
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: *backend-build
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment: *backend-env
    # 仅绑回环，宿主 8001 → 容器 8000，供调试；生产用户入口是 frontend，不直接暴露 backend。
    ports:
      - "127.0.0.1:8001:8000"
    # 共享受控上传存储：backend 写入的 source_file_ref 字节，worker 异步处理时读同一份。
    volumes:
      - upload_storage:/data/uploads
    # internal 连 postgres/redis；web 供 frontend 反代到 backend。
    networks:
      - internal
      - web
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G

  # 普通 Celery worker：消费 default，上传生成与短作业；外部通知使用独立消费者。
  worker:
    build: *backend-build
    restart: unless-stopped
    command: >-
      celery -A app.worker.celery_app.celery_app worker --loglevel=INFO
      --queues=default --hostname=default@%h --prefetch-multiplier=1
      --concurrency=${INGEST_WORKER_CONCURRENCY:-1}
      --max-tasks-per-child=20 --max-memory-per-child=524288
    # Drain legacy parse/notification deliveries already queued on default.
    stop_grace_period: 150s
    env_file:
      - ./backend/.env
    environment: *backend-env
    # 与 backend 共享同一份受控上传存储，异步处理才能读到 backend 写入的字节。
    volumes:
      - upload_storage:/data/uploads
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # A different queue consumer must not make a stopped ordinary worker look healthy.
      test: ["CMD-SHELL", "celery -A app.worker.celery_app.celery_app inspect ping --destination=default@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: ${INGEST_WORKER_MEMORY_LIMIT:-3072M}

  # Polling WeKnora must not consume upload/outbox/heartbeat worker slots.
  # Default + parse + notification consumers share 1 CPU / 4GiB by default.
  parse_worker:
    build: *backend-build
    restart: unless-stopped
    command: >-
      celery -A app.worker.celery_app.celery_app worker --loglevel=INFO
      --queues=parse --hostname=parse@%h --pool=prefork
      --concurrency=1 --prefetch-multiplier=1
      --max-tasks-per-child=100 --max-memory-per-child=262144
    env_file:
      - ./backend/.env
    environment: *backend-env
    # Longer than the 20-second reconciliation batch budget: finish and release leases.
    stop_grace_period: 45s
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app.celery_app inspect ping --destination=parse@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512M

  # Slow external notifications must not occupy upload, outbox or recovery worker slots.
  notification_worker:
    build: *backend-build
    restart: unless-stopped
    command: >-
      celery -A app.worker.celery_app.celery_app worker --loglevel=INFO
      --queues=notifications --hostname=notifications@%h --pool=prefork
      --concurrency=1 --prefetch-multiplier=1
      --max-tasks-per-child=100 --max-memory-per-child=262144
    env_file:
      - ./backend/.env
    environment: *backend-env
    # Two 60-second delivery batches plus database finalization; preserve late acknowledgements.
    stop_grace_period: 150s
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app.celery_app inspect ping --destination=notifications@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512M

  # 重型解析/OCR prefork worker。DOCX/PPTX/XLSX、PDF、图片和旧版 Office 均走此队列。
  # 2GiB 容器内默认只跑 1 个子进程、只预取 1 个任务；每 4 份文件或 RSS 超限后回收。
  # 不得改成 gevent/eventlet。提升 concurrency 前必须同步压测并调整 memory limit。
  ocr_worker:
    build: *backend-build
    restart: unless-stopped
    command: >-
      celery -A app.worker.celery_app.celery_app worker --loglevel=INFO
      --queues=ocr --hostname=ocr@%h --pool=prefork
      --concurrency=${OCR_WORKER_CONCURRENCY:-1}
      --prefetch-multiplier=${OCR_WORKER_PREFETCH_MULTIPLIER:-1}
      --max-tasks-per-child=${OCR_WORKER_MAX_TASKS_PER_CHILD:-4}
      --max-memory-per-child=${OCR_WORKER_MAX_MEMORY_PER_CHILD_KB:-700000}
    env_file:
      - ./backend/.env
    environment: *backend-env
    volumes:
      - upload_storage:/data/uploads
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app.celery_app inspect ping --destination=ocr@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  # Celery beat（定时调度解析对账 / 归档扫描 / 升格推荐 / 通知下发）。
  beat:
    build: *backend-build
    restart: unless-stopped
    command: celery -A app.worker.celery_app.celery_app beat --loglevel=INFO
    env_file:
      - ./backend/.env
    environment: *backend-env
    networks:
      - internal
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # beat 无 inspect ping，按进程存活判断（pgrep 由 procps 提供），
      # 不依赖 celerybeat-schedule 文件（dbm 后端下该文件可能不存在或更新不规律）。
      # bracket trick '[c]elery'：正则不匹配 pgrep 自身命令行（其文本含 '[c]elery' 而非 'celery'），
      # 避免「beat 已挂但 pgrep 命中自己」的假健康。
      test: ["CMD-SHELL", "pgrep -f '[c]elery.*beat' > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # 前端生产托管：nginx 静态托管 Vite dist + 同源反代后端，以非 root nginx 用户监听 8080。
  # **生产用户入口**＝此服务（本地宿主 18080，避免与本机 WeKnora 8080 等常见端口冲突）；backend 的 8001 仅供调试。
  # 不读 backend/.env、不挂源码、不烙真实后端 URL（同源相对路径 + nginx 反代 backend:8000）。
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    # CSP script-src/frame-src/connect-src 预留 ONLYOFFICE 来源；默认空（仅 'self'）。
    # 填**浏览器**可达的 Document Server origin（非容器内 Docker DNS），
    # 配 ONLYOFFICE 时在 ./.env 设 ONLYOFFICE_ORIGIN=https://onlyoffice.example.com。
    environment:
      ONLYOFFICE_ORIGIN: ${ONLYOFFICE_ORIGIN:-}
    ports:
      # Only the host TLS reverse proxy may reach the production frontend hop.
      - "127.0.0.1:18080:8080"
    # 仅在 web 网络：可反代到 backend，但访问不到 postgres/redis（隔离）。
    networks:
      - web
    healthcheck:
      # nginx:alpine 自带 busybox wget；探静态首页即可反映 nginx 存活。
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

# 网络隔离：
#   internal —— 数据/任务面（postgres + redis + backend + worker + beat + migrate）。
#   web      —— 反代面（frontend + backend）。
# postgres/redis 不入 web；frontend 不入 internal，故前端容器无法直连库/缓存。
networks:
  internal:
  web:

volumes:
  pgdata:
  # 受控上传存储（backend 写 / worker 读同一份）。beat 不处理上传，不挂载。
  upload_storage:
