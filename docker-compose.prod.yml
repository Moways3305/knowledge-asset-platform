# Production-only overlay. Keep connector packages outside images and expose them only to backend.
services:
  backend:
    environment:
      WORKBUDDY_CONNECTOR_ARTIFACT_ROOT: /data/workbuddy-connectors
      # Default fail-closed. Set the host value explicitly to true only for approved
      # unsigned enterprise-internal distribution.
      WORKBUDDY_CONNECTOR_ALLOW_INTERNAL: ${WORKBUDDY_CONNECTOR_ALLOW_INTERNAL:-false}
      KAP_PUBLIC_BASE_URL: ${KAP_PUBLIC_BASE_URL:-}
      WORKBUDDY_REMOTE_MCP_ENABLED: ${WORKBUDDY_REMOTE_MCP_ENABLED:-true}
      WORKBUDDY_REMOTE_MCP_TOOLS: ${WORKBUDDY_REMOTE_MCP_TOOLS:-*}
      WORKBUDDY_REMOTE_TOKEN_TTL_HOURS: ${WORKBUDDY_REMOTE_TOKEN_TTL_HOURS:-168}
      WORKBUDDY_REMOTE_REQUEST_MAX_BYTES: ${WORKBUDDY_REMOTE_REQUEST_MAX_BYTES:-65536}
      WORKBUDDY_REMOTE_CONCURRENCY: ${WORKBUDDY_REMOTE_CONCURRENCY:-8}
      WORKBUDDY_REMOTE_TIMEOUT_SECONDS: ${WORKBUDDY_REMOTE_TIMEOUT_SECONDS:-35}
      WORKBUDDY_REMOTE_RATE_LIMIT_PER_MINUTE: ${WORKBUDDY_REMOTE_RATE_LIMIT_PER_MINUTE:-60}
      WORKBUDDY_REMOTE_ALLOWED_ORIGINS: ${WORKBUDDY_REMOTE_ALLOWED_ORIGINS:-}
    volumes:
      - /data/kap/workbuddy-connectors:/data/workbuddy-connectors:ro
